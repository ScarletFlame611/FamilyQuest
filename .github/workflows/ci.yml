name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: familyquest
          POSTGRES_USER: familyquest
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        # Без проверки готовности миграции стартуют раньше, чем база принимает соединения
        options: >-
          --health-cmd "pg_isready -U familyquest -d familyquest"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://familyquest:ci-only@localhost:5432/familyquest
      TEST_DATABASE_URL: postgresql+asyncpg://familyquest:ci-only@localhost:5432/familyquest_test
      JWT_SECRET: ci-only-not-a-secret
      DEMO_MAMA_PASSWORD: ci-only
      DEMO_PAPA_PASSWORD: ci-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check
          ruff format --check
      - name: Миграции
        run: |
          alembic upgrade head
          alembic check
      # Отдельным шагом, чтобы провал проверок рисков был виден сразу в списке шагов
      - name: Проверки рисков
        run: pytest -m risk -v -o addopts=
      - name: Остальные тесты
        run: pytest -m "not risk"

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Зависимости
        run: npm ci
      - name: Проверка типов
        run: npm run typecheck
      - name: Тесты
        run: npm test
