stages:
  - lint
  - test

ruff:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir ruff==0.8.3
    - cd backend
    - ruff check
    - ruff format --check

pytest:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: db
  variables:
    POSTGRES_DB: familyquest
    POSTGRES_USER: familyquest
    POSTGRES_PASSWORD: ci-only
    DATABASE_URL: postgresql+asyncpg://familyquest:ci-only@db:5432/familyquest
    TEST_DATABASE_URL: postgresql+asyncpg://familyquest:ci-only@db:5432/familyquest_test
    JWT_SECRET: ci-only-not-a-secret
    DEMO_MAMA_PASSWORD: ci-only
    DEMO_PAPA_PASSWORD: ci-only
  script:
    - cd backend
    - pip install --no-cache-dir -r requirements-dev.txt
    - alembic upgrade head
    - alembic check
    - pytest

typecheck:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run typecheck
