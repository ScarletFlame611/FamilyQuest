services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://backend:8000
      OPENAPI_URL: http://backend:8000/api/openapi.json
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  locust:
    image: locustio/locust:2.32.4
    profiles: ["loadtest"]
    working_dir: /mnt/locust
    volumes:
      - ./loadtest:/mnt/locust
    command: >
      -f locustfile.py --host http://backend:8000 --headless
      --csv results/locust --html results/report.html --only-summary
      --load-password ${LOAD_PASSWORD} --load-families ${LOAD_FAMILIES:-400}
      --step-users ${STEP_USERS:-20} --step-seconds ${STEP_SECONDS:-30}
    depends_on:
      - backend

volumes:
  db-data:
  frontend-modules:
