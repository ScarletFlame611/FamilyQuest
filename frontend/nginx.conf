server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/stand.crt;
    ssl_certificate_key /etc/nginx/certs/stand.key;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы сборки с хешем в имени не меняются, их можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Все остальные адреса — экраны одностраничного приложения
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
